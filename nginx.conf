server {
    listen 80;
    server_name localhost;

    # Use Docker's internal DNS resolver
    resolver 127.0.0.11 valid=30s;
    set $backend "chat_server";

    # CSP and HSTS wait until there's a real domain and TLS is on — a wrong
    # domain in connect-src or HSTS over plain HTTP does more harm than good.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # On-brand page for a raw upstream failure — only ever seen for a direct
    # navigation/request that doesn't go through fetch() (which handles its
    # own failures in JS, see ConnectionBanner). error.html is a real static
    # file, served by the location / block below like any other asset.
    error_page 502 503 /error.html;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_intercept_errors on;
        proxy_pass http://$backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://$backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}