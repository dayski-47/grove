[package]
name = "chat_server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
axum = { version = "0.8.9" }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-native-tls", "macros", "migrate"] }
rand = "0.9"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "set-header", "limit", "compression-gzip"] }
redis = { version = "1.2.3", features = ["tokio-comp", "connection-manager", "aio"] }
bcrypt = "0.19.2"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
dotenvy = "0.15"
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
bytes = "1"
mimalloc = { version = "0.1", default-features = false }
rustc-hash = "2.1.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = "debuginfo"
