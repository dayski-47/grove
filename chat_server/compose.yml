services:
  db:
    image: postgres:15
    container_name: db
    ports:
      - "5432:5432"
    environment: 
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chat_server
    volumes: 
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports: 
      - "6379:6379"

volumes:
  pg_data: